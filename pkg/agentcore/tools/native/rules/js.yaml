# JavaScript/TypeScript: jest, vitest and the package managers' test scripts
# (see README.md).
rules:
  - name: js-test
    match: '\b(jest|vitest|mocha)\b|\b(npm|pnpm|yarn|bun) (run )?test\b'
    drop:
      - '^\s*(✓|√|✔) '
      - '^\s*PASS\s+\S'
    failure:
      - '^\s*(✕|×|✗|✘) '
      - '^\s*FAIL\s+\S'
      - '●'
      - 'AssertionError'
      - '\d+ (failed|failing)'
    count:
      passed: '^\s*(✓|√|✔) '
    summary: 'tests: {passed} passed'
