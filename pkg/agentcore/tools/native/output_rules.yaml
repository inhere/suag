# Built-in shell output rules for the output minimizer (tools.minimize_output).
# A rule applies when its `match` regex matches the shell command. It drops
# lines that only say something passed and keeps everything that may matter;
# the original output is always kept under a ref. Users override or add
# rules by name in $SUGA_HOME/output-rules.yaml or <repo>/.suga/output-rules.yaml
# (`enabled: false` turns a built-in rule off).
#
# Fields:
#   match    regex on the command
#   drop     lines removed (outside a failing block)
#   block    per-test grouping: lines matching `body` after `start`, or after a
#            `pass` line, belong to that test; a `pass` line drops them, a
#            `fail` line keeps them
#   failure  lines that mean something failed (kept; no summary then)
#   count    name -> regex; matching lines are counted for the summary
#   sum      name -> regex with a capture group; the numbers of the matching
#            lines are added up (a real total, e.g. maven's "Tests run")
#   fold     runs of repeated noise collapsed into one line: start matches the
#            first line of the run, body each further line, text is the line
#            printed instead with {lines} = how many lines went (empty text
#            drops the whole run)
#   summary  printed when nothing failed and a count is > 0; {name} = count,
#            a [part] whose counts are all 0 is left out

rules:
  - name: go-test
    match: '\bgo test\b'
    drop:
      - '^\s*=== (RUN|PAUSE|CONT|NAME)\s'
      - '^\s*--- (PASS|SKIP): '
      - '^PASS$'
      - '^\?\s+\S+\s+\[no test files\]$'
    block:
      start: '^\s*=== RUN\s'
      body: '^ {4}'
      pass: '^\s*--- PASS: '
      fail: '^\s*--- FAIL: '
    failure:
      - '^\s*--- FAIL: '
      - '^FAIL\b'
      - '^panic: '
      - '^\S+\.go:\d+:\d+: '
    count:
      packages: '^ok\s+\S+'
      passed: '^\s*--- PASS: '
    summary: 'go test: {packages} package(s) ok[, {passed} test(s) passed]'

  - name: cargo-test
    match: '\bcargo (test|nextest)\b'
    drop:
      - '^test \S+ \.\.\. ok$'
      - '^\s*(Compiling|Downloaded|Downloading|Fresh) '
    failure:
      - '^test \S+ \.\.\. FAILED$'
      - '^failures:$'
      - 'panicked at'
      - '^error(\[E\d+\])?:'
      - 'test result: FAILED'
    count:
      passed: '^test \S+ \.\.\. ok$'
    summary: 'cargo test: {passed} test(s) passed'

  - name: js-test
    match: '\b(jest|vitest|mocha)\b|\b(npm|pnpm|yarn|bun) (run )?test\b'
    drop:
      - '^\s*(✓|√|✔) '
      - '^\s*PASS\s+\S'
    failure:
      - '^\s*(✕|×|✗|✘) '
      - '^\s*FAIL\s+\S'
      - '●'
      - 'AssertionError'
      - '\d+ (failed|failing)'
    count:
      passed: '^\s*(✓|√|✔) '
    summary: 'tests: {passed} passed'

  - name: pytest
    match: '\bpytest\b|\bpython3? -m pytest\b'
    drop:
      - ' PASSED( |$)'
      - '^\S+ \.+( +\[ *\d+%\])?$'
    failure:
      - ' (FAILED|ERROR)( |$)'
      - '^E\s'
      - '^(FAILED|ERROR) '
      - '^_{3,} .* _{3,}$'
    count:
      passed: ' PASSED( |$)'
    summary: 'pytest: {passed} test(s) passed'

  # Maven: keep the failure details (test failures, compile errors) and a one
  # line summary; drop the build progress noise. The effective-model POM
  # warnings repeat once per build, so they fold into a single line.
  - name: maven
    match: '\bmvnw?\b'
    drop:
      - '^\[INFO\] (Scanning for projects|Building |Download(ing|ed) from|Progress|Results:)'
      - '^\[INFO\] ---'                                       # --- plugin:version:goal --- and ----< group:artifact >---- separators
      - '^\[INFO\]\s+T E S T S\s*$'
      - '^\[INFO\]\s*$'                                       # a bare "[INFO]"
      - '^\[INFO\] (Total time|Finished at):'
      - '^\[INFO\] Running \S'
      - '^\[INFO\] Tests run: .*Time elapsed'
      - '^\[INFO\] Tests run: \d+, Failures: \d+, Errors: \d+, Skipped: \d+\s*$' # the per-run total, reprinted in the summary
      - '^\[INFO\] BUILD SUCCESS$'
      - 'Sharing is only supported for boot loader classes'
    fold:
      - start: '^\s*\[WARNING\] Some problems were encountered while building the effective model'
        body: '^\s*\[WARNING\]'
        text: 'maven: {lines} POM warning line(s) folded'
    failure:
      - '^\[ERROR\]'
      - 'BUILD FAILURE'
      - '<<< (FAILURE|ERROR)!'
      - 'Tests run: \d+, Failures: [1-9]'
      - 'Tests run: \d+, Failures: \d+, Errors: [1-9]'
      - 'COMPILATION ERROR'
      - '\.java:\[\d+,\d+\]'
    count:
      success: '^\[INFO\] BUILD SUCCESS$'
    sum:
      tests: '^\[INFO\] Tests run: (\d+), Failures: \d+, Errors: \d+, Skipped: \d+\s*$'
      failures: '^\[INFO\] Tests run: \d+, Failures: (\d+), Errors: \d+, Skipped: \d+\s*$'
      errors: '^\[INFO\] Tests run: \d+, Failures: \d+, Errors: (\d+), Skipped: \d+\s*$'
      skipped: '^\[INFO\] Tests run: \d+, Failures: \d+, Errors: \d+, Skipped: (\d+)\s*$'
    summary: 'maven: [Tests run {tests}, Failures: {failures}, Errors: {errors}, Skipped: {skipped}; ]BUILD SUCCESS'

  # Gradle: same idea; a plain "> Task :x" line means the task succeeded.
  - name: gradle
    match: '\bgradlew?\b'
    drop:
      - '^> Task \S+ (UP-TO-DATE|NO-SOURCE|FROM-CACHE|SKIPPED)$'
      - '^> Task \S+$'
      - '^> Configure project '
      - '^Download https?://'
      - '^Starting a Gradle Daemon'
      - '^\d+ actionable tasks?:'
      - ' PASSED$'
    failure:
      - ' FAILED$'
      - 'BUILD FAILED'
      - '^e: '
      - 'error:'
      - '^\* What went wrong:'
      - '^\d+ tests? completed, \d+ failed'
      - '^> There were failing tests'
    count:
      passed: ' PASSED$'
    summary: 'gradle: {passed} test(s) passed'
