# suag configuration
# Copy to $SUAG_HOME/config.yaml (default ~/.suag/config.yaml); ${VAR} values are
# expanded from the environment or $SUAG_HOME/.env.

# Main model, "<provider>/<model>". The prefix must be a defined provider (the
# presets openai, anthropic, deepseek, or one under providers:); only the first
# "/" splits, otherwise the whole string is the model id of the provider of
# this setting. Overridden by SUAG_MODEL, then by --model.
model: bailian/glm-5

# Providers. openai / anthropic / deepseek are built in (default base_url and
# the api_key env OPENAI_API_KEY / ANTHROPIC_API_KEY / DEEPSEEK_API_KEY); an
# entry with the same id overrides them field by field. Any other id needs type.
providers:
  bailian:
    type: openai # openai (chat/completions) | openai-responses (Responses API) | anthropic
    base_url: "${BAILIAN_BASE_URL}" # openai type appends /chat/completions
    api_key: "${BAILIAN_API_KEY}"
    # Optional per-model overrides; the context window is otherwise derived
    # from the model name (unknown models: 128000).
    # models:
    #   glm-5:
    #     context_window: 128000
    #     # Optional price in USD per million tokens; used for the cost shown by
    #     # `suag stats` / usage_update when the provider reports no cost.
    #     price: {input: 0.27, output: 1.1, cache_read: 0.07, cache_write: 0}
    #   sonnet:
    #     # A model may use its own protocol and address (e.g. the Claude
    #     # models of a gateway whose other models speak OpenAI).
    #     type: anthropic
    #     base_url: "https://gateway.example/anthropic"
    # Optional extra request headers. "{{session_id}}" becomes the current suag
    # session id (skipped when there is none); User-Agent defaults to "suag".
    # headers:
    #   x-extra: "value"

  # OpenCode Go, OpenAI-compatible endpoint (needs the session header):
  # opencode-go:
  #   type: openai
  #   base_url: "https://opencode.ai/zen/go/v1"
  #   api_key: "${OPENCODE_API_KEY}"
  #   headers:
  #     x-opencode-session: "{{session_id}}"
  # OpenCode Go, Anthropic-compatible endpoint (appends /v1/messages):
  # opencode-go-claude:
  #   type: anthropic
  #   base_url: "https://opencode.ai/zen/go"
  #   api_key: "${OPENCODE_API_KEY}"
  #   headers:
  #     x-opencode-session: "{{session_id}}"
  # Override a preset, e.g. an Anthropic gateway:
  # anthropic:
  #   base_url: "https://gateway.example.com"
  #   # Claude type only, default off: add cache_control breakpoints (system
  #   # becomes a block array). Some gateways reject cache_control.
  #   prompt_cache: true

# Optional cheaper model for context summaries (same reference rules as model;
# a bare id uses the main model's provider). Unset: the turn's own model.
# compact_model: bailian/glm-4-flash

# Optional models tried in order when the main model fails.
# fallback_models:
#   - anthropic/claude-sonnet-4-6
#   - deepseek-chat # bare id: served by the main model's provider

# Context segments. Chat only: after idle_after without input, if the context
# has reached idle_min_ratio of the segment threshold, a new segment is started
# in the background (never during a turn; typing cancels it).
# context:
#   idle_after: 15m     # duration such as 30s / 15m, or seconds; 0 turns it off
#   idle_min_ratio: 0.5 # 0..1
#   fold_every: 0       # history folding: fold older steps every N steps (e.g. 10); 0 (default) = off
#   fold_keep: 5        # steps kept whole (>= 1)

# Workspace directory for file and shell tools
# Defaults to current working directory
workspace: ""

# SerpAPI key for web_search tool
serpapi_key: "" # or reference an env var, e.g. "${SERPAPI_KEY}"

# Optional MCP servers exposed as additional tool providers
mcp:
  servers: []
  # call_timeout_sec: 120  # bound on one MCP tool call
  # servers:
  #   - id: filesystem
  #     command: npx
  #     args:
  #       - -y
  #       - "@modelcontextprotocol/server-filesystem"
  #       - ./workspace
  #     env:
  #       NODE_ENV: development

# Skills (SKILL.md under <workspace>/.agents/skills, <workspace>/skills,
# ~/.agents/skills). With more than list_max skills only workspace skills are
# listed in the prompt; the model searches the rest with skill(query=...).
# always_load puts those skills' bodies in the prompt (as does
# "metadata: {always_load: true}" in a SKILL.md frontmatter).
# skills:
#   list_max: 15
#   always_load: []

# Max ReAct loop steps per agent task
max_steps: 100

# MCP tool schema deferral: auto (defer when schemas exceed ~10% of the context
# window) | always | never. Deferred tools are loaded via the tool_search tool.
tools:
  deferred: auto
  # chat only (run needs --allow-write; --read-only wins; ACP ignores it):
  # allow_write: true  # boolean, default false: enable file_write / shell_exec
  # chat only: ask (default) confirms every non-MCP tool outside the read-only
  # list (file_read, file_list, file_grep, file_find, web_fetch, web_search,
  # skill, update_plan, tool_search) on the terminal;
  # auto never asks. Without a terminal, tools needing confirmation are refused.
  # approval: ask
  # max_output_bytes: 8000   # largest tool result kept whole in the session; larger ones are
  #                          # saved to ~/.suag/sessions/<id>/outputs/ and kept as ref + head/tail
  # max_spill_bytes: 1048576 # raw output cap of one tool call (native and MCP)
  # parallel_reads: true     # run a reply's file_read/list/grep/find calls concurrently
  # read_page_bytes: 32768   # one file_read page per file (most source files fit in one read)
  # minimize_output: true    # tidy shell results (test summaries, folded repeats, no colours); original kept as a ref.
  #                           # Rules: built-in, then $SUAG_HOME/output-rules.yaml, then <workspace>/.suag/output-rules.yaml
  # shell: ""                # shell_exec shell; default pwsh/powershell on Windows, sh elsewhere
  # shell_timeout_max: 600   # max seconds a shell_exec call may ask for (default 120 per call)
  # Read-only directories outside the workspace (file_read/file_list/file_grep/file_find,
  # absolute paths). Writes stay in the workspace.
  # dependency_roots: true   # detect Go module cache, GOROOT/src, ~/.cargo/registry/src
  # read_roots: []           # extra directories, e.g. ["~/src/sdk"]
  # web_fetch:
  #   allow_private: false   # true lets web_fetch reach private/local addresses
  #   proxy: ""             # http://, https:// or socks5:// proxy for web_fetch, e.g. http://127.0.0.1:7890
  # No MCP tool is allowed by default: with both lists empty every MCP call is
  # refused. Entries are "server/toolglob" (a bare "toolglob" in auto_allow
  # matches that tool from any server; prefer the qualified form).
  # auto_allow applies to normal (non --read-only) runs:
  # auto_allow: ["gofer/gofer_*_list", "gofer/gofer_*_get", "gofer/gofer_work_report"]
  # --read-only uses ONLY read_only_allow (auto_allow never widens it) and
  # every entry must be server-qualified:
  # read_only_allow:
  #   - gofer/gofer_*_list
  #   - gofer/gofer_*_get
  #   - gofer/gofer_work_report
  #   - gofer/gofer_session_list

# Long-term memory (the memory tool). All keys are optional.
# memory:
#   write: auto            # auto (default) | off: the memory tool becomes read-only
#   # A session that read external content (web_fetch, web_search, MCP tools,
#   # session_search, recall, ...) is tainted. Its memory writes: ask (default:
#   # chat asks, ACP sends a permission request, run refuses) | deny | allow.
#   write_tainted: ask
#   # Extra tools that taint the session: on every result / only when their
#   # output was saved to a file. shell_exec is the default of taint_on_spill.
#   taint_tools: []
#   taint_on_spill: [shell_exec]
#   user:
#     backend: files       # files (default, $SUAG_HOME/memory/user) | exec
#   project:
#     # Unset: MEMORY.md at the repository root -> files (repository mode,
#     # entries in .suag/memory/); else .gofer/tracker there -> gofer; else
#     # files under $SUAG_HOME/projects/<key>/memory. Set to force one:
#     backend: files       # files | gofer | exec
#   # exec backend (per scope; the command is required and is never discovered):
#   # user:
#   #   backend: exec
#   #   command: my-memory-store
#   #   args: ["--db", "/path/to/store"]
#   #   timeout_sec: 10

# Chat hooks. Disabled unless hooks.command is set; SUAG_HOOKS=off disables
# them regardless. The command is an argv list (no shell) and receives each
# event as one JSON line on stdin.
# hooks:
#   command: [gofer, hook, generic, --agent, suag]
#   timeout_ms: 3000 # ordinary events (default 3000)
#   # Appended to the Stop event argv only. Always set stop_wait_sec together
#   # with it, or Stop is ended after timeout_ms.
#   stop_args: [--wait, "7140"]
#   stop_wait_sec: 7140 # Stop waits stop_wait_sec+2 seconds
#   # PostToolUse is sent only for tools matching these globs (none: never),
#   # renamed to "name" when set. Globs use path.Match; "*" does not match "/".
#   post_tool_use:
#     tools: ["*shell*", "*exec*"]
#     name: shell
