# suag configuration
# Copy to $SUAG_HOME/config.yaml (default ~/.suag/config.yaml); ${VAR} values are
# expanded from the environment or $SUAG_HOME/.env.

# LLM provider settings
llm:
  api_type: openai # openai | anthropic
  provider_name: bailian # openai | deepseek | claude | custom
  model: glm-5 # model name
  api_key: "${BAILIAN_API_KEY}" # set via env: OPENAI_API_KEY / ANTHROPIC_API_KEY / DEEPSEEK_API_KEY
  base_url: "${BAILIAN_BASE_URL}" # optional override (e.g. for OpenAI-compatible gateways)
  # compact_model: glm-4-flash # optional cheaper model (same provider) for context summaries
  # context_window: 128000 # optional; default is derived from the model name
  # Optional extra request headers. "{{session_id}}" becomes the current suag
  # session id (skipped when there is none); User-Agent defaults to "suag".
  # headers:
  #   x-opencode-session: "{{session_id}}" # e.g. required by OpenCode Go

# Workspace directory for file and shell tools
# Defaults to current working directory
workspace: ""

# SerpAPI key for web_search tool
serpapi_key: "" # or reference an env var, e.g. "${SERPAPI_KEY}"

# Optional MCP servers exposed as additional tool providers
mcp:
  servers: []
  # servers:
  #   - id: filesystem
  #     command: npx
  #     args:
  #       - -y
  #       - "@modelcontextprotocol/server-filesystem"
  #       - ./workspace
  #     env:
  #       NODE_ENV: development

# Max ReAct loop steps per agent task
max_steps: 100

# MCP tool schema deferral: auto (defer when schemas exceed ~10% of the context
# window) | always | never. Deferred tools are loaded via the tool_search tool.
tools:
  deferred: auto
  # auto_allow: ["gofer/gofer_*_list", "gofer/gofer_*_get", "gofer/gofer_work_report"]
