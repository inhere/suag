# suag configuration
# Override any value with AXON_<KEY> environment variables
# e.g. AXON_LLM_API_KEY, AXON_LLM_API_TYPE, AXON_LLM_PROVIDER_NAME

# LLM provider settings
llm:
  api_type: openai # openai | anthropic
  provider_name: bailian # openai | deepseek | claude | custom
  model: glm-5 # model name
  api_key: "${BAILIAN_API_KEY}" # set via env: OPENAI_API_KEY / ANTHROPIC_API_KEY / DEEPSEEK_API_KEY
  base_url: "${BAILIAN_BASE_URL}" # optional override (e.g. for OpenAI-compatible gateways)

# Workspace directory for file and shell tools
# Defaults to current working directory
workspace: ""

# SerpAPI key for web_search tool
serpapi_key: "" # set via env: AXON_SERPAPI_KEY

# Optional MCP servers exposed as additional tool providers
mcp:
  servers: []
  # servers:
  #   - id: filesystem
  #     command: npx
  #     args:
  #       - -y
  #       - "@modelcontextprotocol/server-filesystem"
  #       - ./workspace
  #     env:
  #       NODE_ENV: development

# Max ReAct loop steps per agent task
max_steps: 30

# Single-agent runtime selection
agent:
  runtime: "" # default uses agentcore; set "react" to force legacy runner

# Optional agentcore runtime switch for single-agent task execution
agentcore:
  enabled: false

# HTTP server settings (server mode)
server:
  addr: ":8180"

# Logging
log:
  level: info # debug | info | warn | error
